imports:
    - { resource: services-config.yml }

services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    # Core services
    antispam.connection:
        class: AntispamBundle\Services\ConnectionService
        arguments: ["@configuration"]
        public: true

    antispam.inbox:
        class: AntispamBundle\Services\InboxService
        arguments: ["@antispam.connection"]
        public: true

    antispam.message:
        class: AntispamBundle\Services\MessageService
        public: true

    antispam.ssh:
        class: AntispamBundle\Services\SshService
        public: true

    # Scoring / DNSBL / header analysis
    antispam.dnsbl:
        class: AntispamBundle\Services\DnsblService
        arguments: ["@doctrine.orm.default_entity_manager"]
        public: true

    antispam.header_analyzer:
        class: AntispamBundle\Services\HeaderAnalyzer
        public: true

    antispam.clamav:
        class: AntispamBundle\Services\ClamavService
        public: true

    antispam.virustotal:
        class: AntispamBundle\Services\VirusTotalService
        public: true

    antispam.scoring:
        class: AntispamBundle\Services\ScoringService
        arguments: ["@doctrine.orm.default_entity_manager", "@configuration"]
        public: true

    # Impersonation / link / attachment-policy analyzers (pure logic, mirrored in the agent)
    antispam.impersonation_analyzer:
        class: AntispamBundle\Services\ImpersonationAnalyzer
        public: true

    antispam.url_analyzer:
        class: AntispamBundle\Services\UrlAnalyzer
        public: true

    antispam.attachment_policy_analyzer:
        class: AntispamBundle\Services\AttachmentPolicyAnalyzer
        public: true

    # Quarantine digest: signed one-click links + unified IMAP / SSH quarantine access
    antispam.digest_token:
        class: AntispamBundle\Services\DigestTokenService
        arguments: ["%kernel.secret%"]
        public: true

    antispam.quarantine:
        class: AntispamBundle\Services\QuarantineService
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@configuration"
            - "@antispam.ssh"
            # IMAP services connect on construction - resolve them lazily
            - !service_locator
                antispam.connection: "@antispam.connection"
                antispam.inbox: "@antispam.inbox"
                antispam.message: "@antispam.message"
        public: true

    antispam.digest:
        class: AntispamBundle\Services\QuarantineDigestService
        arguments:
            - "@antispam.quarantine"
            - "@antispam.digest_token"
            - "@twig"
            - "@mailer"
            - "@configuration"
            - "@router"
        public: true

    # Shared spam feed (centralized spam DB) — sender/body fingerprints
    antispam.spam_signal:
        class: AntispamBundle\Services\SpamSignalService
        arguments: ["@doctrine.orm.default_entity_manager", "@configuration"]
        public: true

    # Thunderbird plugin — raw-message scanning, login tokens, user feedback
    antispam.raw_scanner:
        class: AntispamBundle\Services\RawMessageScanner
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.header_analyzer"
            - "@antispam.dnsbl"
            - "@antispam.scoring"
            - "@antispam.spam_signal"
            - "@antispam.impersonation_analyzer"
            - "@antispam.url_analyzer"
            - "@antispam.attachment_policy_analyzer"
        public: true

    antispam.plugin:
        class: AntispamBundle\Services\PluginService
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@cache.app"
            - "@antispam.spam_signal"
            - "%kernel.secret%"
            - "@configuration"
        public: true

    # Commands
    AntispamBundle\Command\AntispamGoCommand:
        arguments:
            - "@antispam.inbox"
            - "@event_dispatcher"
            - "@configuration"
        tags: ['console.command']

    AntispamBundle\Command\AntispamCheckCommand:
        arguments:
            - "@event_dispatcher"
        tags: ['console.command']

    AntispamBundle\Command\AgentDeployCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.ssh"
        tags: ['console.command']

    AntispamBundle\Command\AgentSyncCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.ssh"
            - "@antispam.scoring"
        tags: ['console.command']

    AntispamBundle\Command\AgentScanCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.ssh"
        tags: ['console.command']

    AntispamBundle\Command\AgentScanAllCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.ssh"
        tags: ['console.command']

    AntispamBundle\Command\AgentHealthCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.ssh"
        tags: ['console.command']

    AntispamBundle\Command\DigestSendCommand:
        arguments:
            - "@antispam.digest"
        tags: ['console.command']

    AntispamBundle\Command\FeedSyncCommand:
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@antispam.spam_signal"
        tags: ['console.command']

    # Config-check listener
    antispam.checkkonfig.listener:
        class: AntispamBundle\EventListener\CheckConfig\CheckEmailData
        arguments: ["@configuration"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.config, method: CheckEmail }
            - { name: kernel.event_listener, event: antispam.check.config, method: CheckLogin }
            - { name: kernel.event_listener, event: antispam.check.config, method: CheckPass }
            - { name: kernel.event_listener, event: antispam.check.config, method: CheckImap }
            - { name: kernel.event_listener, event: antispam.check.config, method: tryToConnect }

    # Message pipeline
    # Priorities: higher = runs first. Whitelist short-circuits; scoring steps
    # accumulate; final decision runs at the tail.
    antispam.checkemail.listener.alreadychecked:
        class: AntispamBundle\EventListener\Message\CheckIfIsAlreadyChecked
        arguments: ["@antispam.message"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 100000 }

    antispam.checkemail.listener.whitelistcheck:
        class: AntispamBundle\EventListener\Message\CheckWhitelist
        arguments: ["@doctrine.orm.default_entity_manager","@antispam.message"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99999  }

    antispam.checkemail.listener.emailwhitelistcheck:
        class: AntispamBundle\EventListener\Message\CheckEmailWhitelist
        arguments: ["@doctrine.orm.default_entity_manager","@antispam.message"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99998  }

    antispam.checkemail.listener.blacklistcheck:
        class: AntispamBundle\EventListener\Message\CheckBlacklist
        arguments: ["@doctrine.orm.default_entity_manager","@antispam.message","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99997  }

    antispam.checkemail.listener.emailblacklistcheck:
        class: AntispamBundle\EventListener\Message\CheckEmailBlacklist
        arguments: ["@doctrine.orm.default_entity_manager","@antispam.message","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99996  }

    antispam.checkemail.listener.headers:
        class: AntispamBundle\EventListener\Message\CheckHeaders
        arguments: ["@antispam.header_analyzer","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99990  }

    antispam.checkemail.listener.impersonation:
        class: AntispamBundle\EventListener\Message\CheckImpersonation
        arguments: ["@antispam.impersonation_analyzer","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99988  }

    antispam.checkemail.listener.dnsbl:
        class: AntispamBundle\EventListener\Message\CheckDnsbl
        arguments: ["@antispam.dnsbl","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99980  }

    antispam.checkemail.listener.urls:
        class: AntispamBundle\EventListener\Message\CheckUrls
        arguments: ["@antispam.url_analyzer","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99979  }

    antispam.checkemail.listener.shared_feed:
        class: AntispamBundle\EventListener\Message\CheckSharedFeed
        arguments: ["@antispam.spam_signal","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99978  }

    antispam.checkemail.listener.attachment_policy:
        class: AntispamBundle\EventListener\Message\CheckAttachmentPolicy
        arguments: ["@antispam.attachment_policy_analyzer","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99976  }

    antispam.checkemail.listener.attachments:
        class: AntispamBundle\EventListener\Message\CheckAttachments
        arguments: ["@antispam.clamav","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99975  }

    antispam.checkemail.listener.attachments_virustotal:
        class: AntispamBundle\EventListener\Message\CheckAttachmentsVirusTotal
        arguments: ["@antispam.virustotal","@antispam.scoring"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: check, priority: 99973  }

    antispam.checkemail.listener.apply_decision:
        class: AntispamBundle\EventListener\Message\ApplyScoreDecision
        arguments: ["@antispam.scoring","@antispam.inbox"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: decide, priority: 99970  }

    antispam.checkemail.listener.record_signals:
        class: AntispamBundle\EventListener\Message\RecordSpamSignals
        arguments: ["@antispam.spam_signal"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: record, priority: 99965  }

    antispam.checkemail.listener.movetospam:
        class: AntispamBundle\EventListener\Message\MoveToSpam
        arguments: ["@configuration","@antispam.inbox"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: move, priority: 99960  }

    antispam.checkemail.listener.setaschecked:
        class: AntispamBundle\EventListener\Message\SetAsChecked
        arguments: ["@antispam.message"]
        tags:
            - { name: kernel.event_listener, event: antispam.check.message, method: set, priority: -99999  }
