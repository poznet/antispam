# Apache hardening for the Antispam image (enabled as conf-enabled/zz-antispam-security.conf,
# loaded after Debian's security.conf so these values win).
# Security headers of the application itself (CSP, X-Frame-Options, HSTS...) are
# set by Symfony (AntispamBundle\EventListener\SecurityHeadersListener); here only
# what Apache serves without PHP (static files under public/) is covered.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    # "set" (not "always set"): replaces the header PHP sends instead of duplicating it.
    Header set X-Content-Type-Options "nosniff"
    Header always unset X-Powered-By
</IfModule>
