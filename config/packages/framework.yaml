framework:
    secret: '%env(APP_SECRET)%'
    default_locale: pl
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['pl']
    session:
        cookie_secure: auto
        cookie_samesite: lax
    csrf_protection: true
    property_info:
        with_constructor_extractor: true
    php_errors:
        log: true
    mailer:
        dsn: '%env(MAILER_DSN)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
